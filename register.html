<main><section class="form-page"><div class="form-intro"><p class="eyebrow">ශිෂ්‍ය ගිණුම</p><h1>ලියාපදිංචි <span>වන්න</span></h1><p>ඔබගේ ශිෂ්‍ය ගිණුම සාදා පන්ති තොරතුරු වෙත පහසුවෙන් ප්‍රවේශ වන්න.</p></div>
<form id="registerForm" class="form-box">
<label>සම්පූර්ණ නම<input id="regName" type="text" required placeholder="ඔබගේ නම"></label>
<label>දුරකථන අංකය<input id="regPhone" type="tel" required placeholder="07XXXXXXXX"></label>
<label>විද්‍යුත් තැපෑල<input id="regEmail" type="email" required placeholder="example@email.com"></label>
<label>පන්තිය<select id="regClass" required><option value="">පන්තිය තෝරන්න</option><option>බැංකුකරණය</option><option>A/L ආර්ථික විද්‍යාව</option></select></label>
<label>මුරපදය<input id="regPassword" type="password" required minlength="4" placeholder="මුරපදය"></label>
<label>මුරපදය නැවත ඇතුළත් කරන්න<input id="regConfirm" type="password" required minlength="4" placeholder="මුරපදය තහවුරු කරන්න"></label>
<button class="btn full" type="submit">ලියාපදිංචි වන්න</button>
<p class="form-message" id="registerMessage"></p><p class="switch">දැනටමත් ගිණුමක් තිබේද? <a href="login.html">ඇතුල් වන්න</a></p>
</form></section></main><footer><p>© <span id="year"></span> IPS-ANURADHAPURA.</p></footer><script src="script.js"></script></body></html>
